services:
    mysql:
        image: mysql:8.4
        container_name: blog_mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: blog
            MYSQL_USER: blog
            MYSQL_PASSWORD: password
        ports:
            - "3306:3306"
        volumes:
            - hob_mysql_data:/var/lib/mysql

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: blog_phpmyadmin
        restart: unless-stopped
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
        ports:
            - "8081:80"
        depends_on:
            - mysql

volumes:
    hob_mysql_data:
